<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-light">
<div th:replace="fragments/navbar::navbar"></div>

<div class="flex justify-center items-start mt-16 px-4">
    <div class="w-full max-w-md bg-white shadow-md rounded-lg p-6">

        <h3 class="text-center text-2xl font-semibold mb-6">Your Profile</h3>

        <form method="post" th:action="@{/edit-profile}" th:object="${customer}" class="space-y-4">

            <div>
                <label class="block text-gray-700 mb-1">First Name</label>
                <input th:field="*{firstName}" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-green-500 focus:border-green-500 outline-none"/>
            </div>

            <div>
                <label class="block text-gray-700 mb-1">Last Name</label>
                <input th:field="*{lastName}" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-green-500 focus:border-green-500 outline-none"/>
            </div>

            <div>
                <label class="block text-gray-700 mb-1">Phone Number</label>
                <input th:field="*{phoneNumber}" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-green-500 focus:border-green-500 outline-none"/>
            </div>

            <div>
                <label class="block text-gray-700 mb-1">Email</label>
                <input th:value="*{email}" readonly class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-200 text-gray-600 cursor-not-allowed"/>
            </div>

            <button type="submit" onclick="setTimeout(showModal, 100)"
                    class="w-full bg-green-700 text-white py-2 rounded-md hover:bg-green-800 transition">
                Save Changes
            </button>

        </form>
    </div>

    <!-- SAVED SNACKBAR -->
    <div th:if="${success}"
         id="snackbar"
         class="fixed right-5 top-5 bg-green-700 text-white px-5 py-3 rounded shadow-lg opacity-0 translate-y-[-10px] transition-all duration-500">
        <span th:text="${success}"></span>
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const snackbar = document.getElementById("snackbar");
            if (snackbar) {
                setTimeout(() => {
                    snackbar.classList.remove("opacity-0", "translate-y-[-10px]");
                }, 50);

                setTimeout(() => {
                    snackbar.classList.add("opacity-0", "translate-y-[-10px]");
                }, 3000);
            }
        });
    </script>
</div>

<div th:replace="fragments/footer::footer"></div>

</body>
</html>
