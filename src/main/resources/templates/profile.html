<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-50">

<div th:replace="fragments/navbar::navbar"></div>

<div class="max-w-3xl mx-auto mt-12 px-4">

    <div class="text-sm text-gray-600 mb-4">
        <a href="/account" class="text-green-700 hover:underline">Your Account</a>
        <span>›</span>
        <span class="font-semibold text-black">Profile</span>
    </div>

    <h1 class="text-3xl font-semibold mb-6">Your Profile</h1>

    <div class="bg-white border border-gray-200 shadow-md rounded-lg p-6">

        <form method="post" th:action="@{/edit-profile}" th:object="${customer}" class="space-y-5">

            <div>
                <label class="block text-sm font-medium mb-1">First Name</label>
                <input th:field="*{firstName}" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:border-green-600 focus:ring-green-600">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Last Name</label>
                <input th:field="*{lastName}" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:border-green-600 focus:ring-green-600">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Phone Number</label>
                <input th:field="*{phoneNumber}" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:border-green-600 focus:ring-green-600">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input th:value="*{email}" readonly class="w-full bg-gray-200 text-gray-600 border border-gray-300 rounded-md px-3 py-2 cursor-not-allowed">
            </div>

            <button type="submit" class="bg-green-700 text-white w-full py-2.5 rounded-md text-sm font-medium hover:bg-green-800 transition">Save Changes</button>

        </form>

    </div>

</div>

<div th:replace="fragments/snackbar::snackbar"></div>
<div th:replace="fragments/footer::footer"></div>
<script th:src="@{/js/burger.js}"></script>

</body>
</html>
