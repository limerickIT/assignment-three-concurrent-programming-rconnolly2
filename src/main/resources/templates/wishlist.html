<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Wishlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.5/css/dataTables.dataTables.css">
    <script src="https://cdn.datatables.net/2.3.5/js/dataTables.js"></script>
</head>

<body class="bg-gray-50">

<div th:replace="fragments/navbar::navbar"></div>

<div class="max-w-6xl mx-auto mt-10 px-4">

    <div class="text-sm text-gray-600 mb-4">
        <a href="/account" class="hover:underline text-green-700">Your Account</a>
        <span>›</span>
        <span class="font-semibold text-black">Your Wishlist</span>
    </div>

    <h1 class="text-3xl font-semibold mb-8">Your Wishlist</h1>

    <div class="bg-white shadow-md border border-gray-200 rounded-lg p-6">

        <table id="wishlistTable" class="display w-full text-sm border border-gray-300 rounded-md">
            <thead class="bg-gray-100">
            <tr>
                <th class="px-4 py-2">Product</th>
                <th class="px-4 py-2">Wish Name</th>
                <th class="px-4 py-2">Note</th>
                <th class="px-4 py-2">Date Added</th>
                <th class="px-4 py-2 no-sort" style="text-align:center;">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="w : ${wishlist}">
                <td class="px-4 py-3" th:text="${w.productId.productName}"></td>

                <td class="px-4 py-3">
                    <form th:action="@{'/wishlist/edit/' + ${w.wishlistId}}" method="post" class="flex gap-2">
                        <input type="text" name="wishName" th:value="${w.wishlistName}" class="border border-gray-300 rounded-md px-2 py-1 w-full">
                        <button class="text-green-700 hover:text-green-900">
                            <i class="fa-solid fa-check"></i>
                        </button>
                    </form>
                </td>

                <td class="px-4 py-3">
                    <form th:action="@{'/wishlist/edit/' + ${w.wishlistId}}" method="post" class="flex gap-2">
                        <input type="text" name="notes" th:value="${w.notes}" class="border border-gray-300 rounded-md px-2 py-1 w-full">
                        <button class="text-green-700 hover:text-green-900">
                            <i class="fa-solid fa-check"></i>
                        </button>
                    </form>
                </td>

                <td class="px-4 py-3" th:text="${#dates.format(w.addedDate, 'yyyy-MM-dd')}"></td>

                <td class="px-4 py-3 text-center">
                    <a th:href="@{'/wishlist/delete/' + ${w.wishlistId}}" class="text-red-600 hover:text-red-800 text-lg">
                        <i class="fa-solid fa-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

<script>

</script>

<div th:replace="fragments/snackbar::snackbar"></div>
<div th:replace="fragments/footer::footer"></div>
<script th:src="@{/js/wishlist.js}"></script>
<script th:src="@{/js/burger.js}"></script>

</body>
</html>
