<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Address</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

<div th:replace="fragments/navbar::navbar"></div>

<div class="max-w-3xl mx-auto mt-10 px-4">

    <!-- Breadcrumb -->
    <div class="text-sm text-gray-600 mb-4">
        <a href="/account" class="text-green-700 hover:underline">Your Account</a>
        <span>›</span>
        <a href="/addresses" class="text-green-700 hover:underline">Your Addresses</a>
        <span>›</span>
        <span class="font-semibold text-black">Add Address</span>
    </div>

    <h1 class="text-3xl font-semibold mb-6">Add a new address</h1>

    <form th:action="@{/addresses/add}" th:object="${address}" method="post" class="bg-white shadow-md border border-gray-200 rounded-lg p-6 space-y-5">

        <div>
            <label class="block text-sm font-medium mb-1">Full Name</label>
            <input type="text" th:field="*{fullName}" class="w-full border border-gray-300 rounded-md px-3 py-2" placeholder="Full name">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Phone Number</label>
            <input type="text" th:field="*{phoneNumber}" class="w-full border border-gray-300 rounded-md px-3 py-2" placeholder="Phone number">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Address Line 1</label>
            <input type="text" th:field="*{addressLine1}" class="w-full border border-gray-300 rounded-md px-3 py-2" placeholder="Street, house number">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Address Line 2 (optional)</label>
            <input type="text" th:field="*{addressLine2}" class="w-full border border-gray-300 rounded-md px-3 py-2" placeholder="Apartment, suite, etc">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">City</label>
                <input type="text" th:field="*{city}" class="w-full border border-gray-300 rounded-md px-3 py-2">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Postal Code</label>
                <input type="text" th:field="*{postalCode}" class="w-full border border-gray-300 rounded-md px-3 py-2">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Country</label>
            <input type="text" th:field="*{country}" class="w-full border border-gray-300 rounded-md px-3 py-2" placeholder="Country">
        </div>

        <div class="flex items-center space-x-2">
            <input type="checkbox" th:field="*{default}" class="h-4 w-4">
            <label class="text-sm">Set as default address</label>
        </div>

        <button type="submit" class="bg-green-700 text-white w-full py-2.5 rounded-md text-sm font-medium hover:bg-green-800">Save Address</button>

    </form>

</div>

<div th:replace="fragments/footer::footer"></div>

</body>
</html>
