<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Reviews</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.0/css/dataTables.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.datatables.net/2.0.0/js/dataTables.min.js"></script>
</head>

<body class="bg-light">

<div th:replace="fragments/navbar::navbar"></div>

<div class="max-w-5xl mx-auto mt-20 px-4">

    <div class="mb-6 ml-2">
        <a href="/account" class="text-green-700 hover:underline text-sm">&larr; Back to Account</a>
    </div>

    <div class="bg-white shadow-md rounded-lg p-6">

        <h3 class="text-center text-2xl font-semibold mb-6">Your Reviews</h3>

        <table id="reviewsTable" class="display w-full text-sm border border-gray-300">
            <thead class="bg-gray-100 border-b border-gray-300">
            <tr>
                <th class="px-4 py-2 text-left">Product</th>
                <th class="px-4 py-2 text-left">Your Rating</th>
                <th class="px-4 py-2 text-left">Your Review</th>
                <th class="px-4 py-2 text-left">Date</th>
                <th class="px-4 py-2 text-center">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="r : ${reviews}" class="border-b border-gray-200">
                <td class="px-4 py-2">
                    <a th:href="@{'/product/' + ${r.productId.productId}}" class="text-green-700 hover:underline">
                        <span th:text="${r.productId.productName}"></span>
                    </a>
                </td>

                <td class="px-4 py-2">
                    <span class="text-amber-400 text-lg" th:text="${'★'.repeat(r.rating)}"></span>
                    <span class="text-gray-300 text-lg" th:text="${'★'.repeat(5 - r.rating)}"></span>
                </td>

                <td class="px-4 py-2 truncate max-w-xs">
                    <span th:text="${r.reviewText}"></span>
                </td>

                <td class="px-4 py-2" th:text="${r.reviewDate}"></td>

                <td class="px-4 py-2 text-center">
                    <a th:href="@{'/review/delete/' + ${r.reviewId}}"
                       class="text-red-600 hover:text-red-800 text-lg">
                        <i class="fa-solid fa-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        new DataTable("#reviewsTable", {
            perPage: 5,
            perPageSelect: [5, 10, 20],
            searchable: true,
            sortable: true
        });
    });
</script>

<div th:replace="fragments/footer::footer"></div>

</body>
</html>
