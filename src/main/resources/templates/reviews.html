<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Reviews</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.0/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.0/js/dataTables.min.js"></script>
</head>

<body class="bg-gray-50">

<div th:replace="fragments/navbar::navbar"></div>

<div class="max-w-6xl mx-auto mt-10 px-4">

    <div class="text-sm text-gray-600 mb-4">
        <a href="/account" class="hover:underline text-green-700">Your Account</a>
        <span>›</span>
        <span class="font-semibold text-black">Your Reviews</span>
    </div>

    <h1 class="text-3xl font-semibold mb-8">Your Reviews</h1>

    <div class="bg-white shadow-md rounded-lg p-6 border border-gray-200">

        <table id="reviewsTable" class="display w-full text-sm border border-gray-300 rounded-md overflow-hidden">
            <thead class="bg-gray-100 border-b border-gray-300">
            <tr>
                <th class="px-4 py-2 text-left">Product</th>
                <th class="px-4 py-2 text-left">Rating</th>
                <th class="px-4 py-2 text-left">Review</th>
                <th class="px-4 py-2 text-left">Date</th>
                <th class="px-4 py-2 text-center">Actions</th>
            </tr>
            </thead>

            <tbody class="divide-y divide-gray-200">
            <tr th:each="r : ${reviews}">
                <td class="px-4 py-3">
                    <a th:href="@{'/product/' + ${r.productId.productId}}"
                       class="text-green-700 hover:underline">
                        <span th:text="${r.productId.productName}"></span>
                    </a>
                </td>

                <td class="px-4 py-3">
                    <span class="text-amber-400" th:text="${'★'.repeat(r.rating)}"></span>
                    <span class="text-gray-300" th:text="${'★'.repeat(5 - r.rating)}"></span>
                </td>

                <td class="px-4 py-3 max-w-xs truncate">
                    <span th:text="${r.reviewText}"></span>
                </td>

                <td class="px-4 py-3" th:text="${r.reviewDate}"></td>

                <td class="px-4 py-3 text-center">
                    <a th:href="@{'/review/delete/' + ${r.reviewId}}"
                       class="text-red-600 hover:text-red-800 text-lg">
                        <i class="fa-solid fa-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        new DataTable("#reviewsTable", {
            perPage: 5,
            perPageSelect: [5, 10, 20],
            searchable: true,
            sortable: true,
            layout: {
                topStart: null
            }
        });
    });
</script>

<div th:replace="fragments/snackbar::snackbar"></div>
<div th:replace="fragments/footer::footer"></div>

</body>
</html>
