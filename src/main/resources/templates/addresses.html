<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Addresses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-50">

<div th:replace="fragments/navbar::navbar"></div>

<div class="max-w-6xl mx-auto mt-10 px-4">

    <div class="text-sm text-gray-600 mb-4">
        <a href="/account" class="text-green-700 hover:underline">Your Account</a>
        <span>›</span>
        <span class="font-semibold text-black">Your Addresses</span>
    </div>

    <h1 class="text-3xl font-semibold mb-8">Your Addresses</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <a href="/addresses/add"
           class="border-2 border-dashed border-gray-300 rounded-lg flex flex-col items-center justify-center py-16 hover:border-gray-400 transition">
            <i class="fa-solid fa-plus text-4xl text-gray-400 mb-3"></i>
            <span class="text-lg text-gray-600">Add Address</span>
        </a>

        <div th:each="a : ${addresses}" class="bg-white shadow-md rounded-lg p-5 border border-gray-200 flex flex-col justify-between min-h-[240px]">

            <div>
                <div class="text-sm text-gray-500 h-5" th:if="${a.default}">Default</div>
                <div class="text-sm text-gray-500 h-5" th:if="${!a.default}">&nbsp;</div>

                <div class="font-semibold text-lg mt-1" th:text="${a.fullName}"></div>

                <div class="text-gray-700 text-sm mt-1 leading-5">
                    <span th:text="${a.addressLine1}"></span><br>
                    <span th:if="${a.addressLine2}" th:text="${a.addressLine2}"></span><br>
                    <span th:text="${a.city}"></span>,
                    <span th:text="${a.postalCode}"></span><br>
                    <span th:text="${a.country}"></span><br>
                    Phone: <span th:text="${a.phoneNumber}"></span>
                </div>
            </div>

            <div class="flex gap-4 mt-4 text-sm text-green-700">
                <a th:href="@{'/addresses/edit/' + ${a.addressId}}" class="hover:underline">Edit</a>
                <span>|</span>
                <a th:href="@{'/addresses/delete/' + ${a.addressId}}" class="hover:underline text-red-600">Remove</a>
            </div>
        </div>

    </div>
</div>

<div th:replace="fragments/snackbar::snackbar"></div>
<div th:replace="fragments/footer::footer"></div>

</body>
</html>
